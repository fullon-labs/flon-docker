name: flon-${FLON_NETWORK:?set FLON_NETWORK to mainnet or testnet}-history

services:
  funod:
    platform: linux/amd64
    image: ghcr.io/fullon-labs/floncore/flon-node-history:${FLON_VERSION:-v0.9.0}
    container_name: funod-${FLON_NETWORK}-history
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    environment:
      FLON_NETWORK: ${FLON_NETWORK}
      EXPECTED_CHAIN_ID: ${EXPECTED_CHAIN_ID:?set the chain ID from the selected network template}
      P2P_PEER: ${P2P_PEER:?set P2P_PEER in .env}
      SNAPSHOT_FILE: ${SNAPSHOT_FILE:-}
    entrypoint: ["/opt/fullon/start-node.sh"]
    ports: ["${RPC_PORT:-8888}:8888", "${P2P_PORT:-9876}:9876", "${HISTORY_WS_PORT:-9555}:9555"]
    volumes:
      - ./bin/start-node.sh:/opt/fullon/start-node.sh:ro
      - ./bin/healthcheck.sh:/opt/fullon/healthcheck.sh:ro
      - ./config/history/config.ini:/etc/funod/config.ini:ro
      - ./networks/${FLON_NETWORK}/genesis.json:/etc/funod/genesis.json:ro
      - ./data/${FLON_NETWORK}/history:/var/lib/funod
      - ./snapshots/${FLON_NETWORK}:/snapshots:ro
    healthcheck:
      test: ["CMD", "/opt/fullon/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "1"}
