name: flon-${FLON_NETWORK:?set FLON_NETWORK to mainnet or testnet}-cli

services:
  wallet:
    platform: linux/amd64
    build:
      context: .
      args:
        FLON_VERSION: ${FLON_VERSION:-v0.9.0}
    image: local/flon-cli:${FLON_VERSION:-v0.9.0}
    command: ["fuwal", "--unix-socket-path", "/wallet/fuwal.sock", "--wallet-dir", "/wallet/data"]
    restart: unless-stopped
    volumes: ["../wallet/${FLON_NETWORK}:/wallet"]
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "1"}
  cli:
    platform: linux/amd64
    image: local/flon-cli:${FLON_VERSION:-v0.9.0}
    depends_on: [wallet]
    command: ["sleep", "infinity"]
    volumes: ["../wallet/${FLON_NETWORK}:/wallet", "../workspace:/workspace"]
